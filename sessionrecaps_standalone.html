document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olute; left:24px; bottom:14px; display:flex; align-items:center; gap:10px; pointer-events:none\">\n                <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" style=\"width:26px; height:26px\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polygon points=\"10 8.5 16.5 12 10 15.5\" fill=\"#fff\" stroke=\"none\"><\u002Fpolygon><\u002Fsvg>\n                <span style=\"font-size:13px; font-weight:700; color:#fff; letter-spacing:0.02em\">{{ card.duration }} recording<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ showImmersive }}\">\n            <div style=\"position:relative; margin:-22px -24px 0; height:226px; overflow:hidden; background:#0B1020; color:#fff\">\n<img ref=\"{{ card.stillRef }}\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover\">\n              <div style=\"position:absolute; inset:0; background:linear-gradient(to top, rgba(8,12,28,0.92) 0%, rgba(8,12,28,0.55) 42%, rgba(8,12,28,0.08) 100%); pointer-events:none\"><\u002Fdiv>\n              <div style=\"position:absolute; right:16px; top:16px; display:flex; align-items:center; gap:7px; background:rgba(10,14,32,0.6); border:1px solid rgba(255,255,255,0.35); border-radius:999px; padding:5px 11px; pointer-events:none\">\n                <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" style=\"width:13px; height:13px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><polyline points=\"12 7 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n                <span style=\"font-size:12px; font-weight:700; color:#fff\">{{ card.duration }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:absolute; inset:auto 24px 18px 24px; pointer-events:none\">\n                <div style=\"font-size:11.5px; font-weight:700; letter-spacing:0.11em; text-transform:uppercase; color:rgba(255,255,255,0.78)\">{{ card.sessionLab de-ranging session covering the billing migration launch, the delegation shift that made it possible, a tense exchange with a peer VP over headcount, early planning for the next sprint\\u2019s goals, and a check-in on Mac\\u2019s energy heading into Q2. The team\\u2019s ability to self-organize during the launch became the throughline for most of the conversation, surfacing both a real leadership win and a new anxiety about what happens when Mac steps back further.',\n      bullets: ['Billing migration shipped two days early with zero rollbacks','Team unblocked itself without Mac stepping in','January\\u2019s shift to lead-owned incident response drove the change','Mac\\u2019s instinct to step in is triggered by board visibility, not problem size','A headcount disagreement with the VP of Sales is still unresolved and creating friction','Next sprint\\u2019s draft goals lean too heavily on individual heroics rather than systems','Mac flagged feeling stretched thin across three concurrent initiatives'] },\n    actions: [ { t:'44:10', owner:'Mac', text:'will stay out of the next launch war room unless explicitly asked' },\n      { t:'46:32', owner:'Mac', text:'will write down the delegation principle and share it at the next leads meeting' },\n      { t:'50:05', owner:'Lei Yang', text:'will share a framework on delegating when stakes are visible upward before the next session' },\n      { t:'58:40', owner:'Mac', text:'will schedule a direct conversation with the VP of Sales about the headcount disagreement before Friday' },\n      { t:'1:04:15', owner:'Mac', text:'will draft next sprint\\u2019s goals around team systems rather than individual ownership and bring them for review' },\n      { t:'1:10:02', owner:'Lei Yang', text:'will send a short reading on sustainable pacing for leaders carrying multiple initiatives' } ],\n    transcript: [\n      { speaker:'Lei Yang', t:'00:08', text:'Good to see you, Mac. Before we get into anything heavy \\u2014 what went well this sprint? Start me with a win.' },\n      { speaker:'Mac', t:'02:15', text:'Honestly, the launch. We shipped the billing migration two days early and zero rollbacks. The team rallied in a way I haven\\u2019t seen before \\u2014 people were unblocking each other without me having to step in.' },\n      { speaker:'Lei Yang', t:'04:30', text:'That last part is the real win. The early ship is nice, but a team that unblocks itself is a team you\\u2019ve built well. What do you think changed?' },\n      { speaker:'Mac', t:'05:12', text:'I think it goes back to January, when I started giving incident ownership to the leads instead of running every war room myself. It felt risky at the time.' },\n      { speaker:'Lei Yang', t:'07:48', text:'Risky how? Say more about what you were afraid would happen.' },\n      { speaker:'Mac', t:'08:31', text:'That something visible would break and I\\u2019d be the one explaining to the board why I wasn\\u2019t in the room. My instinct to jump in is strongest when the stakes are visible upward.' },\n      { speaker:'Lei Yang', t:'11:05', text:'That\\u2019s a really useful observation. So the trigger isn\\u2019t the size of the problem \\u2014 it\\u2019s who\\u2019s watching. Let\\u2019s make that the thing we work with today.' } ] },\n  { id: 4, n: 4, date: 'Feb 20, 2026', time: '7:00 PM EST', expert: 'Lei Yang', duration: '22 min',\n    summary: { intro: 'A short pre-launch check-in.',\n      bullets: ['Launch-week pressure is surfacing old habits of constant check-ins'] },\n    actions: [ { t:'18:40', owner:'Mac', text:'will let Priya present the launch plan to the exec team' } ],\n    transcript: [\n      { speaker:'Lei Yang', t:'00:11', text:'Launch week is close. How are you sleeping?' },\n      { speaker:'Mac', t:'01:02', text:'Not great, honestly. I keep drafting Slack messages at midnight and deleting them. I know checking in constantly undermines the leads.' },\n      { speaker:'Lei Yang', t:'03:40', text:'Deleting them is progress. Let\\u2019s talk about what you can do with that energy instead \\u2014 what would it look like to prepare the ground rather than patrol it?' } ] },\n  { id: 3, n: 3, date: 'Dec 17, 2025', time: '2:30 PM EST', expert: 'Lei Yang', duration: '55 min',\n    summary: { intro: 'An end-of-year review closing out CX operations progress and setting the theme for next quarter.',\n      bullets: ['Support response times turned around this quarter','October\\u2019s culture conversation was the catalyst for the CX work','End-of-year review: delegation is the theme for next quarter'] },\n    actions: [ { t:'47:00', owner:'Mac', text:'will draft Q1 development goals before the January session' },\n      { t:'49:15', owner:'Mac', text:'will pick one recurring meeting to hand off entirely' } ],\n    transcript: [\n      { speaker:'Lei Yang', t:'00:09', text:'Last session of the year. Let\\u2019s zoom out \\u2014 when you look at this whole sprint, what are you proudest of?' },\n      { speaker:'Mac', t:'01:45', text:'The CX operations work, honestly. We turned support response times around, and it started with the culture conversation we had in October.' } ] },\n  { id: 2, n: 2, date: 'Nov 10, 2025', time: '5:00 PM EST', expert: 'Lei Yang', duration: '50 min',\n    summary: { intro: 'A mid-sprint session on the CX operations audit and the open-questions experiment in 1:1s. Mac walked through the audit findings in detail, including the routing bottlenecks the support leads flagged and the way ticket ownership had quietly drifted since Q3. The conversation moved from there into how 1:1s have changed since Mac started leading with open questions instead of status updates, and closed with a broader reflection on what it means to share context versus conclusions when coaching a team through ambiguity.',\n      bullets: ['CX audit surfaced three quick wins in ticket routing','Open questions in 1:1s are surfacing problems before they become fires','Team morale improves when Mac shares context, not conclusions','Ticket ownership had quietly drifted since Q3 without anyone flagging it','Support leads want more visibility into how routing decisions get made','Mac noticed a pattern of over-explaining decisions instead of inviting input','Next 1:1 round will test asking two open questions before offering any solution'] },\n    actions: [ { t:'42:08', owner:'Mac', text:'will share the CX audit findings with the whole team, not just leads' },\n      { t:'45:40', owner:'Mac', text:'will ask two open questions before offering a solution in 1:1s' } ],\n    transcript: [\n      { speaker:'Lei Yang', t:'00:14', text:'You mentioned last time that 1:1s were feeling like status updates. Did the open-questions experiment change anything?' },\n      { speaker:'Mac', t:'01:20', text:'It did. People started bringing me problems earlier, before they became fires. One of the support leads flagged a ticket routing issue I\\u2019d never have seen.' } ] },\n  { id: 1, n: 1, date: 'Oct 20, 2025', time: '5:00 PM EST', expert: 'Lei Yang', duration: '46 min',\n    summary: { intro: 'A sprint kickoff intake session establishing development goals for the next five sessions.',\n      bullets: ['Development goals set: optimize CX operations, strengthen customer-centric culture','Mac\\u2019s default under pressure is to centralize decisions','Success in March looks like a team running CX without Mac as the bottleneck'] },\n    actions: [ { t:'41:30', owner:'Mac', text:'will complete the leadership self-assessment before the next session' },\n      { t:'44:00', owner:'Mac', text:'will log every decision taken back from the team for one week' } ],\n    transcript: [\n      { speaker:'Lei Yang', t:'00:07', text:'Welcome to the sprint, Mac. Let\\u2019s start with what you want out of the next five sessions \\u2014 if this works, what\\u2019s different in March?' },\n      { speaker:'Mac', t:'01:33', text:'I want a team that runs customer experience without me being the bottleneck. And I want our culture to actually center customers, not just say it does.' } ] }\n];\n\nclass Component extends DCLogic {\n  state = { query: '', open: {}, matchIdx: {}, detailId: null, summaryOpen: {}, modalId: null, modalLayout: 'split' };\n\n  mark(text, q) {\n    const i = text.toLowerCase().indexOf(q.toLowerCase());\n    if (i === -1) return text;\n    return [text.slice(0, i),\n      React.createElement('mark', { key: 'm' }, text.slice(i, i + q.length)),\n      text.slice(i + q.length)];\n  }\n\n  allMatches(s, q) {\n    const lq = q.toLowerCase();\n    const out = [];\n    [s.summary.intro].concat(s.summary.bullets).forEach(t => {\n      if (t.toLowerCase().includes(lq)) out.push({ label: 'Summary', render: () => this.mark(t, q) });\n    });\n    s.actions.forEach(a => {\n      const t = a.owner + ' ' + a.text;\n      if (t.toLowerCase().includes(lq)) out.push({ label: 'Action items', render: () => this.mark(t, q) });\n    });\n    s.transcript.forEach(u => {\n      if (u.text.toLowerCase().includes(lq)) {\n        const i = u.text.toLowerCase().indexOf(lq);\n        const start = Math.max(0, i - 45);\n        const frag = (start > 0 ? '\\u2026' : '') + u.text.slice(start, i + q.length + 70) + '\\u2026';\n        out.push({ label: 'Transcript \\u2014 ' + u.speaker + ', ' + u.t, render: () => React.createElement('span', null, '\\u201c', this.mark(frag, q), '\\u201d') });\n      }\n    });\n    return out;\n  }\n\n  snippetFor(s, q, idx) {\n    const matches = this.allMatches(s, q);\n    if (!matches.length) return null;\n    const i = Math.min(idx || 0, matches.length - 1);\n    const m = matches[i];\n    return {\n      count: matches.length,\n      idx: i,\n      body: React.createElement('span', null,\n        React.createElement('span', { style: { fontWeight: 700, color: '#111318' } }, m.label + '  '), m.render())\n    };\n  }\n\n  matches(s, q) {\n    const lq = q.toLowerCase();\n    const meta = (s.date + ' ' + s.time + ' ' + s.expert + ' session ' + s.n).to  === 1,\n        stillRef: el => { if (el) el.src = s.id === 1 ? PLACEHOLDER_STILL : API_STILL; },\n        sprintLabel: 'Sprint 1 - Session ' + s.n + '',\n        expertInitials: s.expert.split(' ').map(w => w[0]).join(''),\n        open: !!this.state.open[s.id],\n        caret: this.state.open[s.id] ? 'rotate(90deg)' : 'none',\n        snippet: sn ? sn.body : null,\n        snippetMultiple: !!sn && sn.count > 1,\n        snippetCounter: sn ? (sn.idx + 1) + ' of ' + sn.count + ' matches' : '',\n        toggle: () => this.setState(st => ({ open: Object.assign({}, st.open, { [s.id]: !st.open[s.id] }) })),\n        prevMatch: () => this.setState(st => {\n          const matches = this.allMatches(s, q);\n          const cur = st.matchIdx[s.id] || 0;\n          const next = (cur - 1 + matches.length) % matches.length;\n          return { matchIdx: Object.assign({}, st.matchIdx, { [s.id]: next }) };\n        }),\n        nextMatch: () => this.setState(st => {\n          const matches = this.allMatches(s, q);\n          const cur = st.matchIdx[s.id] || 0;\n          const next = (cur + 1) % matches.length;\n          return { matchIdx: Object.assign({}, st.matchIdx, { [s.id]: next }) };\n        }),\n        viewTranscript: () => this.setState({ detailId: s.id }),\n        transcriptAction: (this.props.showTranscriptButton ?? false) ? (() => this.setState({ detailId: s.id })) : undefined,\n        openModal: () => this.setState({ modalId: s.id, modalLayout: 'split' })\n      };\n      });\n    const detail = SESSIONS.find(x => x.id === this.state.detailId);\n    const recordingModal = this.props.recordingModal ?? false;\n    const modalSession = SESSIONS.find(x => x.id === this.state.modalId);\n    return {\n      query: this.state.query,\n      onSearch: e => this.setState({ query: e.target.value, matchIdx: {} }),\n      cards,\n      empty: cards.length === 0,\n      showTile: mode === 'Play tile',\n      showStill: mode === 'Still banner',\n      showImmersive: mode === 'Still hero',\n      showHeroBanner: mode === 'Hero banner',\n      showPlainHeader: mode !== 'Still hero' && mode !== 'Hero banner' && mode !== 'Solid header' && mode !== 'Minimal row' && mode !== 'Coach photo',\n      showSolidHeader: mode === 'Solid header',\n      showMinimalRow: mode === 'Minimal row',\n      showCoachHeader: mode === 'Coach photo',\n      showTranscriptButton: this.props.showTranscriptButton ?? false,\n      introMinHeight: '0px',\n      bulletsMinHeight: '0px',\n      showMoreWrapperMinHeight: '0px',\n      showMoreWrapperPadding: '0px',\n      showMoreButtonMarginTop: '10px',\n      actionsMinHeight: '0px',\n      showDownloadIcon: !(this.props.showTranscriptButton ?? false),\n      transcriptButtonLabel: (this.props.showTranscriptButton ?? false) ? 'View transcript' : 'Transcript',\n      showList: !detail,\n      showDetail: !!detail,\n      detailTitle: detail ? 'Session with ' + detail.expert : '',\n      detailMeta: detail ? detail.date + ' \\u00b7 ' + detail.time + ' \\u00b7 ' + detail.duration : '',\n      detailTranscript: detail ? detail.transcript : [],\n      detailBack: () => this.setState({ detailId: null }),\n      showRecordingModalMode: recordingModal,\n      showSeparateButtons: !recordingModal,\n      showModal: !!modalSession,\n      closeModal: () => this.setState({ modalId: null }),\n      modalTitle: modalSession ? 'Session with ' + modalSession.expert : '',\n      modalMeta: modalSession ? modalSession.date + ' \\u00b7 ' + modalSession.time + ' \\u00b7 ' + modalSession.duration : '',\n      modalStillUrl: modalSession ? (modalSession.id === 1 ? PLACEHOLDER_STILL : API_STILL) : PLACEHOLDER_STILL,\n      modalStillRef: el => { if (el) el.src = modalSession ? (modalSession.id === 1 ? PLACEHOLDER_STILL : API_STILL) : PLACEHOLDER_STILL; },\n      modalTranscript: modalSession ? modalSession.transcript : [],\n      modalVideoMaxHeight: this.state.modalLayout === 'transcript' ? '0px' : '100%',\n      modalShowTranscript: this.state.modalLayout !== 'video',\n      setModalLayoutVideo: () => this.setState({ modalLayout: 'video' }),\n      setModalLayoutSplit: () => this.setState({ modalLayout: 'split' }),\n      setModalLayoutTranscript: () => this.setState({ modalLayout: 'transcript' }),\n      modalLayoutVideoBg: this.state.modalLayout === 'video' ? '#fff' : 'transparent',\n      modalLayoutVideoColor: this.state.modalLayout === 'video' ? '#111318' : '#78716C',\n      modalLayoutSplitBg: this.state.modalLayout === 'split' ? '#fff' : 'transparent',\n      modalLayoutSplitColor: this.state.modalLayout === 'split' ? '#111318' : '#78716C',\n      modalLayoutTranscriptBg: this.state.modalLayout === 'transcript' ? '#fff' : 'transparent',\n      modalLayoutTranscriptColor: this.state.modalLayout === 'transcript' ? '#111318' : '#78716C'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
